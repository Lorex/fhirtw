# 與 .github/workflows/deploy.yml 相同的部署流程，供 GitLab 鏡像使用。
# 需要在 GitLab CI/CD 變數設定 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID。
stages:
  - deploy

deploy_to_cloudflare:
  stage: deploy
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx cf deploy ./public --dry-run
    - npx cf deploy ./public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
